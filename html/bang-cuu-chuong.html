<!DOCTYPE html>
<html lang = "vi">
	<head>
		<title>Bảng cửu chương</title>
		<meta charset = "utf-8">
		<link rel="stylesheet" href="../css/bang-cuu-chuong.css">
	</head>
	<body>
		<div class = "container">
			<table>
				<caption>Bảng cửu chương</caption>
				<tr>
					<td class="form">
						<form>
							<label>Nhập vào 1 số từ 2 đến 10:</label>
							<input type = "number" name = "txtSo" id = "txtSo" placeholder="Nhập vào 1 số" min = "2" max = "10" value = "2">
							<input type = "button" id = "btnPrint" value = "In bảng cửu chương" onclick="printBCC(document.getElementById('txtSo').value)">
						</form>
					</td>
					<td class="noidung">
						<div id = "result"></div>
					</td>
				</tr>
			</table>
		</div>
        <script src = "../js/lib.js"></script>
	</body>
</html>
