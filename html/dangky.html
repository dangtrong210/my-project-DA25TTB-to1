<!DOCTYPE html>
<html lang="vi">
	<head>
		<title>Đăng ký</title>
		<meta charset="utf-8">
		<link rel="stylesheet" href="../css/dangky.css">
	</head>
	<body>
		<div class="container">
			<h2>Đăng ký</h2>
			<form id="frmLogin">
				<div class="form-group">
					<label for="txtName">Họ và tên</label>
					<input type="text" id="txtName" name="txtName">
				</div>
				<div class="form-group">
					<label for="Age">Ngày, tháng, năm sinh</label>
					<input type="date" id="Age" name="Age">
				</div>
				<div class="form-group">
					<label for="gioitinh">Nam</label>
					<input type="radio" id="Gioitinh" name="Gioitinh" value="Nam">
					<label for="gioitinh">Nữ</label>
					<input type="radio" id="Gioitinh" name="Gioitinh" value="Nữ">
				</div>
				<div class="form-group">
					<label for="txtUsername">Tên đăng nhập</label>
					<input type="text" id="txtUsername" name="txtUsername">
				</div>
				<div class="form-group">
					<label for="txtPassword">Mật khẩu</label>
					<input type="password" id="txtPassword" name="txtPassword">
				</div>
				<div class="form-group">
					<label for="Email">Email</label>
					<input type="email" id="Email" name="Email">
				</div>
				
				<div class="form-control">
					<input type="submit" value="Đăng ký" name="sbLogin" id="control">
					<input type="reset" value="Reset" name="sbReset" id="control">
				</div>
			</form>
		</div>
	</body>
</html>
